# `gui` module: desktop apps and fonts. Not loaded on headless machines.
# `adopt = true` keeps an already-installed app instead of replacing it.

[bootstrap.packages]
"brew-cask:wezterm" = { os = "macos", adopt = true }
"brew-cask:1password-cli" = { os = "macos", adopt = true }
"brew-cask:wireshark-app" = { os = "macos", adopt = true }
"brew-cask:copilot-cli" = { os = "macos", adopt = true }
"brew-cask:corelocationcli" = { os = "macos", adopt = true }
"brew-cask:firefox" = { os = "macos", adopt = true }
"brew:mpv" = { os = "macos" }
"brew:fancy-cat" = { os = "macos" }
"brew:sane-backends" = { os = "macos" }
# fonts are the one cask kind that also works on Linux
"brew-cask:font-hack-nerd-font" = { os = ["macos", "linux"] }
"brew-cask:font-jetbrains-mono-nerd-font" = { os = ["macos", "linux"] }
