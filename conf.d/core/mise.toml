# Language runtimes. Pinned to what the Mac runs today (brew / rustup).
# These replace: brew node/go/python/zig/rust, the brew-vs-rustup cargo
# shadowing, and the GOROOT=$(brew --prefix golang) export in .zshenv.

[tools]
node = "26.5.0"
python = "3.14.7"
go = "1.26.5"
# mise's rust backend drives rustup (RUSTUP_HOME/CARGO_HOME stay ~/.rustup, ~/.cargo),
# so pinned toolchains (1.84 … 1.93, nightly) remain per-project `rust-toolchain.toml` concerns.
rust = { version = "1.96.1", components = "rust-analyzer,clippy,rustfmt" }
zig = "0.16.0"
# bumped from 0.11.28: mise pipx: dependency locking needs uv >= 0.12.10
uv = "0.12.23"
